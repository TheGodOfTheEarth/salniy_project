services:
   postgres:
      image: postgres:16
      container_name: autoservice-db
      restart: unless-stopped
      environment:
         POSTGRES_USER: autoservice
         POSTGRES_PASSWORD: autoservice_pass
         POSTGRES_DB: autoservice_db
         POSTGRES_HOST_AUTH_METHOD: trust
      ports:
         - '5432:5432'
      volumes:
         - postgres_data:/var/lib/postgresql/data
      command: >
         postgres 
         -c ssl=off

volumes:
   postgres_data:
